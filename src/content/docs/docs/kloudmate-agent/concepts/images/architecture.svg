<svg viewBox="0 0 1320 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <title id="t">KloudMate Agent v2 — VM auto-instrumentation architecture</title>
  <desc id="d">A Linux VM runs kmagent: a control-plane executor (discovery, auto-instrument join, instrumentation manager, eBPF capability gate) plus a collector export hub. Opt-in per-service injection and an eBPF baseline feed app traces and RED/map telemetry to the collector, which exports to KloudMate. A backend and frontend drive the agent via the /agents/config-check protocol. A layered model L0–L5 maps the instrumentation depth.</desc>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1.5 1.5 L7.5 4.5 L1.5 7.5" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="1010" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="46" font-size="26" font-weight="500" fill="#1b1a17">KloudMate Agent v2 — VM Auto-Instrumentation</text>
  <text x="40" y="72" font-size="14" fill="#6b6862">Install once → discover · instrument · eBPF baseline. Server-pushed config; all telemetry exits via the existing collector pipeline.</text>

  <!-- ============ CONTROL PLANE ============ -->
  <text x="40" y="106" font-size="11" font-weight="500" fill="#a29e95" letter-spacing="0.5">CONTROL PLANE</text>

  <g>
    <rect x="40" y="116" width="300" height="104" rx="8" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.4"/>
    <text x="58" y="144" font-size="14" font-weight="500" fill="#1b1a17">kloudmate-frontend (UI)</text>
    <text x="58" y="168" font-size="12" fill="#6b6862">Discovered-services tab</text>
    <text x="58" y="190" font-size="12" fill="#6b6862">Per-service Instrument toggle</text>
  </g>

  <g>
    <rect x="372" y="116" width="470" height="104" rx="8" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.4"/>
    <text x="390" y="144" font-size="14" font-weight="500" fill="#1b1a17">kloudmate-backend — control plane</text>
    <text x="390" y="168" font-size="12" fill="#6b6862">config-check handler · structured config generation</text>
    <text x="390" y="190" font-size="12" fill="#6b6862">inventory ingest · getVmConfig (mirror K8s)</text>
  </g>

  <g>
    <rect x="874" y="116" width="406" height="104" rx="8" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.4"/>
    <text x="892" y="144" font-size="14" font-weight="500" fill="#1b1a17">Postgres / Hasura</text>
    <text x="892" y="168" font-size="12" fill="#6b6862">agents · agent_integrations</text>
    <text x="892" y="190" font-size="12" fill="#6b6862">vm_resources · config.vm · vm_apm</text>
  </g>

  <line x1="340" y1="168" x2="372" y2="168" stroke="#8a8780" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="842" y1="168" x2="874" y2="168" stroke="#8a8780" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ============ config-check protocol seam ============ -->
  <line x1="470" y1="220" x2="470" y2="352" stroke="#8a8780" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="772" y1="352" x2="772" y2="220" stroke="#8a8780" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="492" y="250" width="258" height="46" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.2"/>
  <text x="621" y="270" font-size="12.5" font-weight="500" fill="#3a3833" text-anchor="middle">POST /agents/config-check</text>
  <text x="621" y="287" font-size="10.5" fill="#7a776f" text-anchor="middle">unified host + K8s contract</text>
  <text x="455" y="240" font-size="10.5" fill="#8a8780" text-anchor="end">↓ config · vm_apm · restart</text>
  <text x="787" y="240" font-size="10.5" fill="#8a8780">↑ capabilities · discovered_services · status</text>

  <!-- ============ THE VM ============ -->
  <rect x="40" y="314" width="956" height="606" rx="10" fill="#fdfdfc" stroke="#8f8c84" stroke-width="2"/>
  <text x="60" y="340" font-size="14" font-weight="500" fill="#1b1a17">VM — Linux host</text>
  <text x="178" y="340" font-size="12" fill="#6b6862">· kmagent (systemd) · all telemetry exits via the existing collector</text>

  <!-- kmagent control sub-box -->
  <rect x="64" y="352" width="908" height="150" rx="8" fill="#ffffff" stroke="#6b6862" stroke-width="1.4"/>
  <text x="80" y="375" font-size="13" font-weight="500" fill="#1b1a17">kmagent — control-plane executor</text>
  <text x="300" y="375" font-size="11" fill="#6b6862">updater loop drives /agents/config-check check-in</text>

  <!-- 4 kmagent components -->
  <g>
    <rect x="80" y="390" width="210" height="98" rx="7" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
    <text x="94" y="414" font-size="12.5" font-weight="500" fill="#15414a">Discovery</text>
    <text x="94" y="436" font-size="11" fill="#4a6e75">internal/discovery/vm</text>
    <text x="94" y="456" font-size="11" fill="#4a6e75">/proc · classify · ports</text>
    <text x="94" y="474" font-size="11" fill="#4a6e75">stable service_id</text>
  </g>
  <g>
    <rect x="302" y="390" width="210" height="98" rx="7" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
    <text x="316" y="414" font-size="12.5" font-weight="500" fill="#15414a">Auto-instrument</text>
    <text x="316" y="436" font-size="11" fill="#4a6e75">internal/autoinstrument</text>
    <text x="316" y="456" font-size="11" fill="#4a6e75">discovery + opt-in</text>
    <text x="316" y="474" font-size="11" fill="#4a6e75">→ desired-state</text>
  </g>
  <g>
    <rect x="524" y="390" width="210" height="98" rx="7" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
    <text x="538" y="414" font-size="12.5" font-weight="500" fill="#15414a">Instrumentation mgr</text>
    <text x="538" y="436" font-size="11" fill="#4a6e75">internal/instrumentation/vm</text>
    <text x="538" y="456" font-size="11" fill="#4a6e75">systemd drop-ins</text>
    <text x="538" y="474" font-size="11" fill="#4a6e75">restart + rollback</text>
  </g>
  <g>
    <rect x="746" y="390" width="210" height="98" rx="7" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
    <text x="760" y="414" font-size="12.5" font-weight="500" fill="#15414a">Capabilities + gate</text>
    <text x="760" y="436" font-size="11" fill="#4a6e75">internal/capabilities · /ebpf</text>
    <text x="760" y="456" font-size="11" fill="#4a6e75">kernel/BTF/caps probe</text>
    <text x="760" y="474" font-size="11" fill="#4a6e75">gates the eBPF receiver</text>
  </g>

  <line x1="290" y1="439" x2="302" y2="439" stroke="#8a8780" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="512" y1="439" x2="524" y2="439" stroke="#8a8780" stroke-width="1.4" marker-end="url(#arw)"/>

  <!-- ===== instrumented services ===== -->
  <rect x="64" y="538" width="500" height="104" rx="8" fill="#ffffff" stroke="#a8a59d" stroke-width="1.3"/>
  <text x="80" y="560" font-size="12.5" font-weight="500" fill="#1b1a17">Instrumented services — systemd, opt-in per service</text>
  <g font-size="11.5">
    <rect x="78" y="572" width="90" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="123" y="596" font-weight="500" fill="#1b1a17" text-anchor="middle">Java</text>
    <text x="123" y="614" font-size="10" fill="#6b6862" text-anchor="middle">javaagent</text>
    <rect x="176" y="572" width="90" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="221" y="596" font-weight="500" fill="#1b1a17" text-anchor="middle">.NET</text>
    <text x="221" y="614" font-size="10" fill="#6b6862" text-anchor="middle">CLR profiler</text>
    <rect x="274" y="572" width="90" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="319" y="596" font-weight="500" fill="#1b1a17" text-anchor="middle">Node.js</text>
    <text x="319" y="614" font-size="10" fill="#6b6862" text-anchor="middle">--require</text>
    <rect x="372" y="572" width="90" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="417" y="596" font-weight="500" fill="#1b1a17" text-anchor="middle">Python</text>
    <text x="417" y="614" font-size="10" fill="#6b6862" text-anchor="middle">sitecustomize</text>
    <rect x="470" y="572" width="90" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="515" y="596" font-weight="500" fill="#1b1a17" text-anchor="middle">PHP 7.x</text>
    <text x="515" y="614" font-size="10" fill="#6b6862" text-anchor="middle">Zend extension</text>
  </g>

  <!-- eBPF (kmagent component) -->
  <rect x="576" y="538" width="396" height="104" rx="8" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
  <text x="592" y="562" font-size="12.5" font-weight="500" fill="#15414a">eBPF — ebpfreceiver / OBI fork</text>
  <text x="592" y="586" font-size="11.5" fill="#4a6e75">RED metrics · service map · DAM — zero-code</text>
  <text x="592" y="608" font-size="11.5" fill="#4a6e75">attaches to all processes</text>
  <text x="592" y="628" font-size="11.5" fill="#4a6e75">kernel-gated (≥ 4.14)</text>

  <!-- collector hub (kmagent component) -->
  <rect x="64" y="668" width="908" height="86" rx="8" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.5"/>
  <text x="80" y="692" font-size="13" font-weight="500" fill="#15414a">Collector (otelcol) — export hub</text>
  <text x="80" y="714" font-size="11.5" fill="#4a6e75">receivers: hostmetrics · filelog · otlp :4318 · ebpfreceiver · db*</text>
  <text x="80" y="734" font-size="11.5" fill="#4a6e75">single pipeline — no new ingestion path</text>

  <!-- VM internal flows -->
  <path d="M560 488 C 480 512, 360 512, 320 538" fill="none" stroke="#8a8780" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="372" y="524" font-size="10.5" fill="#8a8780">writes drop-in + (consent) restart</text>
  <line x1="800" y1="488" x2="785" y2="538" stroke="#8a8780" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="812" y="520" font-size="10.5" fill="#8a8780">enables ebpfreceiver</text>
  <line x1="300" y1="642" x2="300" y2="668" stroke="#2a7d8c" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="312" y="662" font-size="10.5" fill="#2a7d8c">app traces · OTLP :4318</text>
  <line x1="772" y1="642" x2="772" y2="668" stroke="#2a7d8c" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="784" y="662" font-size="10.5" fill="#2a7d8c">eBPF spans + metrics</text>

  <!-- collector -> KloudMate -->
  <path d="M900 754 C 1010 790, 1090 800, 1150 820" fill="none" stroke="#2a7d8c" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ============ KloudMate ingest ============ -->
  <rect x="1040" y="792" width="240" height="74" rx="10" fill="#15414a" stroke="#15414a"/>
  <text x="1160" y="822" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">KloudMate</text>
  <text x="1160" y="844" font-size="11" fill="#bfe0e4" text-anchor="middle">OTLP ingest — traces/metrics/logs</text>

  <!-- ============ LAYERED MODEL rail ============ -->
  <text x="1024" y="340" font-size="13" font-weight="500" fill="#1b1a17">Layered model</text>
  <text x="1024" y="357" font-size="10.5" fill="#9a978f">baseline auto · depth opt-in</text>

  <g font-size="11.5">
    <rect x="1024" y="368" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="390" font-weight="500" fill="#1b1a17">L5 · Legacy app traces</text>
    <text x="1040" y="409" font-size="10.5" fill="#6b6862">native PHP 7 Zend extension</text>
    <rect x="1024" y="430" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="452" font-weight="500" fill="#1b1a17">L4 · DB &amp; middleware</text>
    <text x="1040" y="471" font-size="10.5" fill="#6b6862">auto-wired receivers + eBPF DAM</text>
    <rect x="1024" y="492" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="514" font-weight="500" fill="#1b1a17">L3 · Modern app traces</text>
    <text x="1040" y="533" font-size="10.5" fill="#6b6862">injector: Java/.NET/Node/Python</text>
    <rect x="1024" y="554" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="576" font-weight="500" fill="#1b1a17">L2 · Universal RED / map</text>
    <text x="1040" y="595" font-size="10.5" fill="#6b6862">eBPF — default-on, kernel-gated</text>
    <rect x="1024" y="616" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="638" font-weight="500" fill="#1b1a17">L1 · Infra / host</text>
    <text x="1040" y="657" font-size="10.5" fill="#6b6862">hostmetrics · filelog · journald</text>
    <rect x="1024" y="678" width="256" height="56" rx="6" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.3"/>
    <text x="1040" y="700" font-weight="500" fill="#1b1a17">L0 · Discovery</text>
    <text x="1040" y="719" font-size="10.5" fill="#6b6862">service / runtime / DB inventory</text>
  </g>

  <!-- ============ legend ============ -->
  <line x1="40" y1="950" x2="1280" y2="950" stroke="#e6e4df" stroke-width="1"/>
  <g font-size="12" fill="#4a4843">
    <rect x="40" y="966" width="22" height="14" rx="3" fill="#e4f0f2" stroke="#2a7d8c" stroke-width="1.4"/>
    <text x="70" y="977">kmagent components</text>
    <rect x="240" y="966" width="22" height="14" rx="3" fill="#f3f2ef" stroke="#b4b1a9" stroke-width="1.4"/>
    <text x="270" y="977">apps · control plane · layers</text>
    <line x1="520" y1="973" x2="560" y2="973" stroke="#2a7d8c" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="568" y="977">telemetry flow</text>
    <line x1="700" y1="973" x2="740" y2="973" stroke="#8a8780" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="748" y="977">control / config flow</text>
  </g>
</svg>
