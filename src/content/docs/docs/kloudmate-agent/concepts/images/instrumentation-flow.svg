<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How zero-code instrumentation works</title>
  <desc>The KloudMate agent runs on virtual machines and Docker hosts and covers the whole stack three ways with no source-code changes: kernel-level eBPF reads traffic on the wire for app traces and database activity with no restart; per-language runtime instrumentation adds deep, framework-aware traces; and database monitoring connects with read-only access to surface slow queries, locks and health. The agent processes everything on your host and sends it securely to KloudMate.</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#3D63E0"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1020" fill="#F6F5F1"/>

  <rect x="56" y="48" width="28" height="28" rx="8" fill="#3D63E0"/>
  <path transform="translate(70,62)" d="M1,-7 L-4,1 L-0.5,1 L-2,7 L4,-1 L0.5,-1 Z" fill="#FFFFFF"/>
  <text x="96" y="69" font-size="15" font-weight="600" fill="#3D63E0" letter-spacing="0.3">KloudMate agent · v2</text>

  <rect x="790" y="50" width="254" height="32" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
  <g transform="translate(832,66)" fill="none" stroke="#3D63E0" stroke-width="1.8" stroke-linecap="round">
    <rect x="-9" y="-7" width="18" height="6" rx="1.5"/><rect x="-9" y="1" width="18" height="6" rx="1.5"/>
    <circle cx="5.5" cy="-4" r="1.1" fill="#3D63E0" stroke="none"/><circle cx="5.5" cy="4" r="1.1" fill="#3D63E0" stroke="none"/>
  </g>
  <text x="850" y="71" font-size="13" font-weight="500" fill="#23221F">Runs on VMs and Docker</text>

  <text x="56" y="120" font-size="30" font-weight="600" fill="#23221F" letter-spacing="-0.4">How zero-code instrumentation works</text>
  <text x="56" y="150" font-size="16" font-weight="400" fill="#6A675F">The agent covers your whole stack three ways — none of them touch your source code.</text>

  <rect x="430" y="180" width="240" height="54" rx="12" fill="#3D63E0"/>
  <text x="550" y="213" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Install the agent</text>
  <line x1="550" y1="234" x2="550" y2="260" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="400" y="262" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="550" y="290" font-size="16" font-weight="600" fill="#23221F" text-anchor="middle">Auto-discover services</text>
  <text x="550" y="310" font-size="12.5" font-weight="400" fill="#6A675F" text-anchor="middle">apps, databases and runtimes on the host</text>
  <line x1="550" y1="324" x2="550" y2="350" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="56" y="352" width="988" height="58" rx="12" fill="#E9F6EF" stroke="#CFEBDD"/>
  <g transform="translate(412,381)" fill="none" stroke="#16A06B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-11 L9,-6.5 V1 C9,7.5 5,10.5 0,12 C-5,10.5 -9,7.5 -9,1 V-6.5 Z"/><path d="M-4,0 L-1.3,3.2 L4.5,-3.5"/>
  </g>
  <text x="440" y="388" font-size="17" font-weight="600" fill="#15724E">No source-code changes — ever.</text>

  <line x1="550" y1="410" x2="550" y2="430" stroke="#3D63E0" stroke-width="2"/>
  <polyline points="550,430 210,430 210,442" fill="none" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="550" y1="430" x2="550" y2="442" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <polyline points="550,430 890,430 890,442" fill="none" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="95" y="446" width="230" height="30" rx="15" fill="#ECF0FD"/>
  <text x="210" y="466" font-size="14" font-weight="600" fill="#3D63E0" text-anchor="middle">eBPF · kernel level</text>
  <rect x="435" y="446" width="230" height="30" rx="15" fill="#ECF0FD"/>
  <text x="550" y="466" font-size="14" font-weight="600" fill="#3D63E0" text-anchor="middle">runtime instrumentation</text>
  <rect x="775" y="446" width="230" height="30" rx="15" fill="#ECF0FD"/>
  <text x="890" y="466" font-size="14" font-weight="600" fill="#3D63E0" text-anchor="middle">database monitoring</text>

  <rect x="56" y="494" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="210" y="518" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Attach eBPF probes</text>
  <text x="210" y="537" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">nothing to deploy</text>
  <line x1="210" y1="552" x2="210" y2="572" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="56" y="574" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="210" y="598" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Read traffic on the wire</text>
  <text x="210" y="617" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">HTTP, gRPC and SQL</text>
  <line x1="210" y1="632" x2="210" y2="652" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="56" y="654" width="308" height="66" rx="12" fill="#E9F6EF" stroke="#CFEBDD"/>
  <g transform="translate(82,687)" fill="none" stroke="#16A06B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,0 L-1.3,3.2 L4.5,-3.5"/></g>
  <text x="218" y="682" font-size="15" font-weight="600" fill="#15724E" text-anchor="middle">App traces + DB activity</text>
  <text x="210" y="702" font-size="12" font-weight="400" fill="#2E8B68" text-anchor="middle">every request · no restart</text>

  <rect x="396" y="494" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="550" y="518" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Auto-instrument the app</text>
  <text x="550" y="537" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">Java · Node · Python · .NET · PHP</text>
  <line x1="550" y1="552" x2="550" y2="572" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="396" y="574" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="550" y="598" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Restart, health-gated</text>
  <text x="550" y="617" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">restart, not rewrite · auto-rollback</text>
  <line x1="550" y1="632" x2="550" y2="652" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="396" y="654" width="308" height="66" rx="12" fill="#E9F6EF" stroke="#CFEBDD"/>
  <g transform="translate(420,687)" fill="none" stroke="#16A06B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,0 L-1.3,3.2 L4.5,-3.5"/></g>
  <text x="556" y="682" font-size="15" font-weight="600" fill="#15724E" text-anchor="middle">Deep, framework-aware traces</text>
  <text x="550" y="702" font-size="12" font-weight="400" fill="#2E8B68" text-anchor="middle">method level · no code edits</text>

  <rect x="736" y="494" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="890" y="518" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Connect, read-only</text>
  <text x="890" y="537" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">guided by a wizard</text>
  <line x1="890" y1="552" x2="890" y2="572" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="736" y="574" width="308" height="58" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="890" y="598" font-size="15.5" font-weight="600" fill="#23221F" text-anchor="middle">Run safe queries + logs</text>
  <text x="890" y="617" font-size="12" font-weight="400" fill="#6A675F" text-anchor="middle">top queries, locks, health</text>
  <line x1="890" y1="632" x2="890" y2="652" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="736" y="654" width="308" height="66" rx="12" fill="#E9F6EF" stroke="#CFEBDD"/>
  <g transform="translate(762,687)" fill="none" stroke="#16A06B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,0 L-1.3,3.2 L4.5,-3.5"/></g>
  <text x="898" y="682" font-size="15" font-weight="600" fill="#15724E" text-anchor="middle">Slow queries, locks, health</text>
  <text x="890" y="702" font-size="12" font-weight="400" fill="#2E8B68" text-anchor="middle">per database · no app changes</text>

  <polyline points="210,720 210,748 548,748" fill="none" stroke="#3D63E0" stroke-width="2"/>
  <line x1="550" y1="720" x2="550" y2="748" stroke="#3D63E0" stroke-width="2"/>
  <polyline points="890,720 890,748 552,748" fill="none" stroke="#3D63E0" stroke-width="2"/>
  <line x1="550" y1="748" x2="550" y2="788" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="370" y="790" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#E7E4DC"/>
  <text x="550" y="816" font-size="16" font-weight="600" fill="#23221F" text-anchor="middle">Processed on your host</text>
  <text x="550" y="836" font-size="12.5" font-weight="400" fill="#6A675F" text-anchor="middle">lightweight and secure</text>
  <line x1="550" y1="856" x2="550" y2="882" stroke="#3D63E0" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="400" y="884" width="300" height="66" rx="12" fill="#3D63E0"/>
  <text x="550" y="910" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">KloudMate</text>
  <text x="550" y="930" font-size="12.5" font-weight="400" fill="#DCE6FF" text-anchor="middle">traces · service map · database monitoring</text>

  <circle cx="437" cy="980" r="4" fill="#16A06B"/>
  <text x="449" y="985" font-size="13" font-weight="400" fill="#6A675F">green = no source-code changes</text>
</svg>
