<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="890" viewBox="0 0 1160 890" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>KloudMate agent v2 — features and benefits</title>
  <desc>Install one agent for full-stack monitoring with no code changes: fast setup, automatic app tracing, a unified view of apps, databases, infrastructure, network and cloud, database insights, self-healing reliability, and it runs anywhere.</desc>

  <rect x="0" y="0" width="1160" height="890" fill="#F6F5F1"/>

  <rect x="64" y="60" width="28" height="28" rx="8" fill="#3D63E0"/>
  <path transform="translate(78,74)" d="M1,-7 L-4,1 L-0.5,1 L-2,7 L4,-1 L0.5,-1 Z" fill="#FFFFFF"/>
  <text x="104" y="81" font-size="16" font-weight="600" fill="#3D63E0" letter-spacing="0.3">KloudMate agent · v2</text>

  <text x="64" y="142" font-size="40" font-weight="600" fill="#23221F" letter-spacing="-0.5">Install once. See everything.</text>
  <text x="64" y="192" font-size="40" font-weight="600" fill="#23221F" letter-spacing="-0.5">Change nothing.</text>

  <text x="64" y="232" font-size="17" font-weight="400" fill="#6A675F">A lightweight agent gives you full-stack monitoring across your apps,</text>
  <text x="64" y="256" font-size="17" font-weight="400" fill="#6A675F">databases, servers and network — with no code changes or per-app setup.</text>

  <g font-size="14.5" font-weight="500" fill="#23221F">
    <rect x="64" y="284" width="192" height="34" rx="17" fill="#FFFFFF" stroke="#E7E4DC"/>
    <circle cx="82" cy="301" r="3.5" fill="#3D63E0"/><text x="94" y="306">Applications</text>
    <rect x="274" y="284" width="192" height="34" rx="17" fill="#FFFFFF" stroke="#E7E4DC"/>
    <circle cx="292" cy="301" r="3.5" fill="#3D63E0"/><text x="304" y="306">Databases</text>
    <rect x="484" y="284" width="192" height="34" rx="17" fill="#FFFFFF" stroke="#E7E4DC"/>
    <circle cx="502" cy="301" r="3.5" fill="#3D63E0"/><text x="514" y="306">Infrastructure</text>
    <rect x="694" y="284" width="192" height="34" rx="17" fill="#FFFFFF" stroke="#E7E4DC"/>
    <circle cx="712" cy="301" r="3.5" fill="#3D63E0"/><text x="724" y="306">Network</text>
    <rect x="904" y="284" width="192" height="34" rx="17" fill="#FFFFFF" stroke="#E7E4DC"/>
    <circle cx="922" cy="301" r="3.5" fill="#3D63E0"/><text x="934" y="306">Any cloud</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="352" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="86" y="374" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <path transform="translate(110,398)" d="M2,-12 L-7,1 L-1,1 L-4,12 L7,-2 L1,-2 Z" fill="#3D63E0" stroke="none"/>
    <text x="86" y="452" font-size="19" font-weight="600" fill="#23221F">Up and running in minutes</text>
    <text x="86" y="480" font-size="14" font-weight="400" fill="#6A675F">Install the agent — it finds</text>
    <text x="86" y="502" font-size="14" font-weight="400" fill="#6A675F">your apps, databases and servers.</text>

    <rect x="416" y="352" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="438" y="374" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <g transform="translate(462,398)" fill="none" stroke="#3D63E0" stroke-width="2.2">
      <polyline points="-3,-7 -10,0 -3,7"/><polyline points="3,-7 10,0 3,7"/><line x1="1.5" y1="-9" x2="-1.5" y2="9"/>
    </g>
    <text x="438" y="452" font-size="19" font-weight="600" fill="#23221F">No code changes</text>
    <text x="438" y="480" font-size="14" font-weight="400" fill="#6A675F">Apps trace themselves across</text>
    <text x="438" y="502" font-size="14" font-weight="400" fill="#6A675F">Java, Node, Python, .NET, PHP.</text>

    <rect x="768" y="352" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="790" y="374" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <g transform="translate(814,398)" fill="#FFFFFF" stroke="#3D63E0" stroke-width="2.2">
      <rect x="-10" y="-3" width="13" height="13" rx="3"/><rect x="-3" y="-10" width="13" height="13" rx="3"/>
    </g>
    <text x="790" y="452" font-size="19" font-weight="600" fill="#23221F">Your whole stack, one view</text>
    <text x="790" y="480" font-size="14" font-weight="400" fill="#6A675F">Apps, databases, servers and</text>
    <text x="790" y="502" font-size="14" font-weight="400" fill="#6A675F">network, together in one place.</text>

    <rect x="64" y="544" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="86" y="566" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <g transform="translate(110,590)" fill="none" stroke="#3D63E0" stroke-width="2.2">
      <ellipse cx="0" cy="-9" rx="10" ry="3.6"/><path d="M-10,-9 V8"/><path d="M10,-9 V8"/>
      <path d="M-10,-0.5 A10,3.6 0 0 0 10,-0.5"/><path d="M-10,8 A10,3.6 0 0 0 10,8"/>
    </g>
    <text x="86" y="644" font-size="19" font-weight="600" fill="#23221F">Database insight made easy</text>
    <text x="86" y="672" font-size="14" font-weight="400" fill="#6A675F">Find slow queries, locks and</text>
    <text x="86" y="694" font-size="14" font-weight="400" fill="#6A675F">health across Postgres, MySQL.</text>

    <rect x="416" y="544" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="438" y="566" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <g transform="translate(462,590)" fill="none" stroke="#3D63E0" stroke-width="2.2">
      <path d="M0,-12 L10,-7 V1 C10,8 5.5,11.5 0,13 C-5.5,11.5 -10,8 -10,1 V-7 Z"/><path d="M-4.5,0 L-1.5,3.5 L5,-4"/>
    </g>
    <text x="438" y="644" font-size="19" font-weight="600" fill="#23221F">Monitoring you can trust</text>
    <text x="438" y="672" font-size="14" font-weight="400" fill="#6A675F">The agent watches its own</text>
    <text x="438" y="694" font-size="14" font-weight="400" fill="#6A675F">health and recovers itself.</text>

    <rect x="768" y="544" width="328" height="170" rx="16" fill="#FFFFFF" stroke="#E7E4DC"/>
    <rect x="790" y="566" width="48" height="48" rx="12" fill="#ECF0FD"/>
    <g transform="translate(814,590)" fill="none" stroke="#3D63E0" stroke-width="2.2">
      <path d="M-9,5.5 a4.5,4.5 0 0 1 1,-8.85 A6.5,6.5 0 0 1 5.2,-4.6 a4.8,4.8 0 0 1 4.6,4.3 A4.3,4.3 0 0 1 8,5.5 Z"/>
    </g>
    <text x="790" y="644" font-size="19" font-weight="600" fill="#23221F">Runs anywhere you do</text>
    <text x="790" y="672" font-size="14" font-weight="400" fill="#6A675F">VMs, containers, Kubernetes</text>
    <text x="790" y="694" font-size="14" font-weight="400" fill="#6A675F">and every major cloud.</text>
  </g>

  <rect x="64" y="740" width="1032" height="76" rx="16" fill="#E9F6EF" stroke="#CFEBDD"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(158,778)" fill="none" stroke="#1A9E6A" stroke-width="2.2"><circle cx="-2" cy="-2" r="6"/><line x1="2.5" y1="2.5" x2="8" y2="8"/></g>
    <text x="180" y="784" font-size="16" font-weight="600" fill="#23221F">Find issues faster</text>
    <g transform="translate(502,778)" fill="none" stroke="#1A9E6A" stroke-width="2.2"><path d="M-9,0 C-4.5,-6.5 4.5,-6.5 9,0 C4.5,6.5 -4.5,6.5 -9,0 Z"/><circle cx="0" cy="0" r="2.4"/></g>
    <text x="524" y="784" font-size="16" font-weight="600" fill="#23221F">No blind spots</text>
    <g transform="translate(846,778)" fill="none" stroke="#1A9E6A" stroke-width="2.2"><circle cx="0" cy="0" r="8.5"/><line x1="0" y1="0" x2="0" y2="-5"/><line x1="0" y1="0" x2="3.8" y2="1.5"/></g>
    <text x="868" y="784" font-size="16" font-weight="600" fill="#23221F">Less setup, lower effort</text>
  </g>

  <text x="580" y="852" font-size="15" font-weight="500" fill="#908C83" text-anchor="middle">Less time instrumenting. More time shipping.</text>
</svg>
