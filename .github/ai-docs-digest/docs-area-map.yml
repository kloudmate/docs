# Additional fine-grained docs-area rules.
# These supplement product-area-map.yml with docs-specific path signals.
mappings:
  - match:
      paths:
        - 'CHANGELOG*'
        - 'BREAKING*'
        - 'MIGRATION*'
        - 'UPGRADE*'
    docs_area: Release Notes / Migration guides
    confidence: high

  - match:
      paths:
        - 'README*'
        - 'docs/**'
        - '*.md'
    docs_area: General documentation
    confidence: medium

  - match:
      paths:
        - 'docker-compose*'
        - 'Dockerfile*'
        - '.env.example'
        - 'docker/**'
    docs_area: On-Prem / Installation
    confidence: medium

  - match:
      paths:
        - 'helm/**'
        - 'charts/**'
        - 'values*.yaml'
        - 'values*.yml'
    docs_area: On-Prem / Installation
    confidence: high

  - match:
      paths:
        - 'openapi*'
        - 'swagger*'
        - 'api-spec*'
        - 'api/**'
    docs_area: API reference
    confidence: high
