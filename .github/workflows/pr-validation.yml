name: PR Validation

on:
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Frontmatter
        run: npm run validate:frontmatter

      - name: Lint Markdown
        run: npm run lint:md

      - name: Build Site (Check for Broken Links)
        run: npm run build
