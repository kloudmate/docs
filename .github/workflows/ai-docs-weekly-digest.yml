name: AI Docs Weekly Digest

on:
  # Run every Monday at 03:30 UTC, summarising the previous Mon–Sun window.
  schedule:
    - cron: '30 3 * * 1'

  # Allow manual runs with an optional week-start override.
  workflow_dispatch:
    inputs:
      week_start:
        description: >
          Week start date in YYYY-MM-DD format (Monday).
          Leave blank to use the most recent Monday.
        required: false
        type: string

# Minimal required permissions — no extra access granted.
permissions:
  contents: write   # commit the digest markdown file
  issues: write     # create/comment on the tracking issue

jobs:
  generate-digest:
    name: Generate Weekly Digest
    runs-on: ubuntu-latest

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      WEEK_START: ${{ inputs.week_start || '' }}
      ARTIFACTS_DIR: /tmp/digest-artifacts
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-3.5-sonnet' }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          # Provide the token so the Octokit commit step can push to this repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js setup ──────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/ai-docs-digest/scripts/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install script dependencies
        working-directory: .github/ai-docs-digest/scripts
        run: npm ci

      # ── 4. Collect changes ────────────────────────────────────────────────────
      - name: Collect GitHub changes
        working-directory: .github/ai-docs-digest/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx main.ts collect

      # ── 5. Generate AI digest ─────────────────────────────────────────────────
      - name: Generate AI digest
        working-directory: .github/ai-docs-digest/scripts
        run: npx tsx main.ts generate

      # ── 6. Commit digest to repo ──────────────────────────────────────────────
      - name: Commit digest
        working-directory: .github/ai-docs-digest/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx main.ts commit

      # ── 7. Post summary to tracking issue ─────────────────────────────────────
      - name: Post GitHub summary
        working-directory: .github/ai-docs-digest/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx main.ts post

      # ── 8. Send Slack notification ────────────────────────────────────────────
      - name: Send Slack notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .github/ai-docs-digest/scripts
        run: npx tsx main.ts slack

      # ── 9. Upload debug artifacts ──────────────────────────────────────────────
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-artifacts-${{ github.run_id }}
          path: /tmp/digest-artifacts/
          retention-days: 30
